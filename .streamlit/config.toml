# Palette: paper #EEEBE3, red #f01e2c, black. Charts use black + red, checked
# for colour-blind separation on this background.
[theme]
base = "light"
backgroundColor = "#EEEBE3"
secondaryBackgroundColor = "#E3DFD4"
textColor = "#000000"
primaryColor = "#f01e2c"
font = "sans serif"

[client]
toolbarMode = "viewer"
